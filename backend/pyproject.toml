[project]
name = "unidate-api"
version = "0.1.0"
description = "Read-only API and collection pipeline for UniDate"
requires-python = ">=3.13,<3.15"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "docling>=2.68,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pypdf>=5.4,<7",
  "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
