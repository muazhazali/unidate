name: Monthly calendar source check

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Extract sources but do not call Ollama or open a PR
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen --no-dev
      - working-directory: backend
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run --no-dev python scripts/sync_calendars.py --extract-only
          else
            uv run --no-dev python scripts/sync_calendars.py
          fi
      - name: Open review pull request when sources changed
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: calendar-sync-${{ github.run_id }}
        shell: bash
        run: |
          if git diff --quiet -- backend/data/source_state.json backend/data/proposals; then
            echo "No source changes detected."
            exit 0
          fi
          git config user.name "unidate-bot"
          git config user.email "unidate-bot@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add backend/data/source_state.json backend/data/proposals
          git commit -m "data: propose monthly calendar updates"
          git push --set-upstream origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "data: review monthly calendar updates" \
            --body "Docling and Ollama Cloud detected complete, Pydantic-validated event proposals. Review every proposal against its source before updating approved events.json." \
            --base main \
            --head "$BRANCH")
          echo "Created $PR_URL"
